[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-omega"
version = "0.1.0"
description = "A small-model agent that repairs a live vLLM fleet, with policy-checked actions and an independent referee"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
# SimPy digital twin and its live 3D view (apps/twin).
twin = ["simpy>=4.1", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.unittest]
start-directory = "tests"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
