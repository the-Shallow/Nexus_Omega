# Static infrastructure: HAProxy data plane, gateway admin, Prometheus, GPU telemetry.
# vLLM workers are launched separately by nexus.target.manager so they can be
# reconfigured and rolled back one at a time. Everything shares the "nexus" network.
name: nexus

networks:
  nexus:
    external: true

services:
  haproxy:
    # Inference traffic on :8100 (workers a and b; b via Toxiproxy). Its runtime
    # API (:9999) is reachable only on the nexus network, by the gateway admin.
    image: haproxy:3.0.5
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8100:8100"
      - "127.0.0.1:8405:8405"
    networks: [nexus]
    restart: unless-stopped

  gateway:
    # Admin API only: drain / undrain / weight, applied through HAProxy's runtime API.
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -q fastapi uvicorn && uvicorn main:app --host 0.0.0.0 --port 8110"
    volumes:
      - ../../apps/gateway:/app:ro
    environment:
      NEXUS_HAPROXY_RUNTIME: haproxy:9999
      NEXUS_ADMIN_TOKEN: ${NEXUS_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8110:8110"
    networks: [nexus]
    restart: unless-stopped

  toxiproxy:
    # Network-fault point between the gateway and worker b (proxy "b" in toxiproxy.json).
    # Faults are added and removed through the API by nexus.faults.network.
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    networks: [nexus]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [nexus]
    restart: unless-stopped

  dcgm-exporter:
    # Verify the tag on NGC at bring-up; basic DCGM_FI_DEV_* metrics need no extra privileges.
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
    cap_add: [SYS_ADMIN]
    ports:
      - "9400:9400"
    networks: [nexus]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
