# Data plane in front of the vLLM workers. Replaces the single-process Python
# proxy, which saturated one CPU core at ~30 req/s. Drain and weight changes go
# through the runtime API (stats socket), driven by apps/gateway (admin only).
#
# Active health checks are intentionally off: the doctor must see crash and
# link faults itself, and /health cannot see silent tool-call faults anyway.

global
    maxconn 8192
    nbthread 8
    stats socket ipv4@0.0.0.0:9999 level admin
    log stdout format raw local0 warning

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout queue 2s
    default-server init-addr last,libc,none resolvers docker

frontend inference
    bind :8100
    default_backend vllm

backend vllm
    balance leastconn
    # http-after-response also stamps errors HAProxy generates itself (e.g. 503 when a worker is down)
    http-after-response set-header x-nexus-worker %s
    server a nexus-a:8000 weight 10
    server b toxiproxy:8666 weight 10

frontend metrics
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string "ok" if { path /health }
