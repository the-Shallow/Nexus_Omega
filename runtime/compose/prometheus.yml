global:
  scrape_interval: 5s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["nexus-a:8000", "nexus-b:8000"]
  - job_name: agent
    static_configs:
      - targets: ["nexus-agent:8000"]
  - job_name: haproxy
    static_configs:
      - targets: ["haproxy:8405"]
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
